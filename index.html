<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e13" />
    <meta name="description" content="中枢台 Zhongshu Desk。面向价格结构、趋势证据与多周期对照的技术分析工作台。" />
    <title>中枢台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#research-title">跳到震荡区间列表</a>
    <header class="toolbar">
      <div class="toolbar-primary">
        <div class="brand">
          <span class="hub-glyph" aria-hidden="true"></span>
          <h1>中枢台</h1>
        </div>
        <form id="quote-form">
          <label>
            <span class="visually-hidden" data-i18n="otherSymbol">代码</span>
            <input id="custom-symbol" type="text" name="symbol" autocomplete="off" spellcheck="false" placeholder="300308 或 AAPL" />
          </label>
          <button type="submit" id="quote-submit">读取</button>
        </form>
        <div class="market-toggle" role="group" aria-label="Market">
          <button type="button" id="market-ashare" data-market="ashare" aria-pressed="true">A股</button>
          <button type="button" id="market-us" data-market="us" aria-pressed="false">美股</button>
        </div>
        <span class="workspace-label" data-i18n="workspaceLabel">技术研判</span>
        <div class="toolbar-actions">
          <button type="button" id="lang">EN</button>
        </div>
      </div>
      <div class="toolbar-scroll">
        <div class="chip-row" role="group" aria-labelledby="tf-label">
          <span id="tf-label" class="chip-label visually-hidden" data-i18n="tfGroup">周期</span>
          <div class="segmented">
            <button type="button" class="chip" data-tf="5m" aria-pressed="false">5m</button>
            <button type="button" class="chip" data-tf="15m" aria-pressed="false">15m</button>
            <button type="button" class="chip" data-tf="30m" aria-pressed="false">30m</button>
            <button type="button" class="chip" data-tf="1h" aria-pressed="false">1h</button>
            <button type="button" class="chip" data-tf="D" aria-pressed="true">D</button>
            <button type="button" class="chip" data-tf="W" aria-pressed="false">W</button>
          </div>

        </div>
        <details class="chart-settings" id="chart-settings">
          <summary id="settings-label">图表设置</summary>
          <div class="settings-body">
          <div class="range-tools">
            <button type="button" class="chip" id="fit-recent">近 90 根</button>
            <button type="button" class="chip" id="fit-all">全部历史</button>
          </div>
        <div class="chip-row" role="group" aria-labelledby="layer-label">
          <span id="layer-label" class="chip-label visually-hidden" data-i18n="layerGroup">图层</span>
          <button type="button" class="chip" id="layer-all">全显</button>
          <button type="button" class="chip" id="layer-none">全隐</button>
          <button type="button" class="chip" id="layer-bi" aria-pressed="true" title="笔：相邻高低点连成的一小段走势。">笔</button>
          <button type="button" class="chip" id="layer-seg" aria-pressed="true" title="线段：由几笔组成的更大一段走势。">线段</button>
          <button type="button" class="chip" id="layer-zs" aria-pressed="true" title="震荡区间（中枢）：价格来回重叠的区域。">震荡区</button>
          <button type="button" class="chip" id="layer-bsp" aria-pressed="true" title="买卖点：结构标注，不是下单信号。">买卖点</button>
          <button type="button" class="chip" id="layer-ma" aria-pressed="false">MA</button>
        </div>
        <div class="chip-row" role="group" aria-labelledby="level-label">
          <span id="level-label" class="chip-label visually-hidden" data-i18n="level">层级</span>
          <div class="segmented">
            <button type="button" class="chip" id="level-bi" aria-pressed="true" title="用“笔”来找震荡区间。">按笔看</button>
            <button type="button" class="chip" id="level-seg" aria-pressed="false" title="用“线段”来找震荡区间。">按线段看</button>
          </div>
        </div>

          <button type="button" id="methods-open">研究口径</button>
          </div>
        </details>
        <span id="toolbar-context" class="toolbar-context"></span>
      </div>
    </header>
    <div class="desk" id="desk">
      <nav class="watchlist" id="watchlist" aria-labelledby="watch-title">
        <h2 id="watch-title" data-i18n="watchlist">自选</h2>
        <div id="watch-items"></div>
      </nav>
      <section class="stage" aria-label="Chart">
        <div class="chart-meta">
          <div class="chart-meta-head">
            <h2 id="study-title"></h2>
            <p id="stage-reading"></p>
          </div>
          <p id="study-blurb" class="visually-hidden"></p>
          <div class="provenance" id="provenance">
            <p id="source-line"></p>
            <p id="timeframe-line"></p>
            <p id="freshness-line"></p>
            <p id="level-note"></p>
          </div>
          <ul id="chart-legend" class="legend"></ul>
        </div>
        <div class="chart-stage">
          <div id="banner" role="status" hidden></div>
          <div id="chart" role="group" tabindex="-1"></div>
        </div>
        <p id="structure-count"></p>
        <section class="comparison-panel" aria-labelledby="comparison-title">
          <h3 id="comparison-title"></h3>
          <div id="comparison-rows" class="comparison-rows"></div>
          <p id="comparison-note" class="meta"></p>
        </section>
      </section>
      <aside class="dock" id="dock">
        <h2 id="quote-title" data-i18n="quoteBoard">行情</h2>
        <div id="quote-board" class="quote-board"></div>
        <div id="mobile-comparison" class="mobile-comparison"></div>
        <section class="research-panel" aria-labelledby="research-title">
          <h2 id="research-title"></h2>
          <div id="research-reading"></div>
          <div id="research-evidence"></div>
          <h3 id="levels-title"></h3>
          <div id="research-levels"></div>
          <p id="levels-note" class="meta"></p>
          <div id="research-scenarios"></div>
          <p id="research-limits" class="meta"></p>
        </section>
        <p id="select-status" class="visually-hidden" aria-live="polite"></p>
        <details class="structure-detail">
          <summary id="structure-detail-title"></summary>
        <h2 id="hubs-title" data-i18n="summary">结构研判</h2>
        <div id="callout"></div>
        <h3 id="hub-list-title" data-i18n="hubListTitle">震荡区间</h3>
        <div id="hub-list"></div>
        </details>
      </aside>
    </div>
    <div class="mobile-tabs" role="group" aria-label="Panels">
      <button type="button" id="tab-chart" aria-pressed="true">图</button>
      <button type="button" id="tab-watch" aria-pressed="false">自选</button>
      <button type="button" id="tab-dock" aria-pressed="false">行情</button>
    </div>
    <footer>
      <p id="footer-chart"></p>
      <p id="footer-advice"></p>
    </footer>
    <dialog id="methods" aria-labelledby="methods-title">
      <div class="dialog-head">
        <h2 id="methods-title" tabindex="-1"></h2>
        <button type="button" id="methods-close">关闭</button>
      </div>
      <div id="methods-body" class="dialog-body"></div>
    </dialog>
    <noscript>需要 JavaScript 才能计算结构并绘制 K 线。JavaScript is required to draw the bars and the hubs.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
